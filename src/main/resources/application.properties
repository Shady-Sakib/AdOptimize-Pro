spring.application.name=online-ad-optimizer
# Render/Railway/Fly inject PORT; falls back to 8080 locally
server.port=${PORT:8080}
# Trust X-Forwarded-* headers from the hosting platform's HTTPS proxy
server.forward-headers-strategy=framework

# ---------------------------------------------------------------
# MySQL connection
# The database is created automatically on first start.
# Override without editing this file, e.g.:
#   DB_USERNAME=root DB_PASSWORD=secret ./mvnw spring-boot:run
# For TiDB Cloud, set DB_URL to a full JDBC URL that already names the database:
#   jdbc:mysql://<host>:4000/<db>?sslMode=VERIFY_IDENTITY&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ad_optimizer?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Run schema.sql on every start (all statements are idempotent)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ---------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# ---------------------------------------------------------------
# Session and error handling
# ---------------------------------------------------------------
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set COOKIE_SECURE=true when served over HTTPS (production)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-stacktrace=never
server.error.include-message=never

# ---------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------
# Code every administrator must enter to sign in or create an admin account
app.admin.group-code=${ADMIN_GROUP_CODE:group 5}

# Insert demo users, campaigns, payments and 90 days of statistics when the database is empty
app.seed.enabled=${SEED_ENABLED:true}

# Traffic simulator: generates impressions, clicks and conversions for live campaigns
app.simulation.interval-ms=20000
app.simulation.initial-delay-ms=15000

# Lock an email address after this many failed sign-in attempts
app.security.max-login-attempts=5
app.security.lockout-minutes=5

logging.level.com.adoptimizer=INFO
